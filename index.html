<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrufflx Portfolio</title>

    <style>
      body {
        padding-left: 10px;
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(180deg, #a72222, #111010);
        background-attachment: fixed;
        font-family: "Fredoka", sans-serif;
        position: relative;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: url("./images/BackgroundImage/BackgroundImage.png") center / cover;
        opacity: 0.08;
        pointer-events: none;
        z-index: -1;
      }

      .H1Titles, .H3Titles, .PTitles {
        color: white;
        font-weight: 700;
        text-shadow: 1px 1px 0 black;
      }

      .H1Titles {
        font-size: 2em;
        text-shadow: 2px 2px 0 black;
        text-decoration: underline;
        text-decoration-color: white;
        text-underline-offset: 8px;
      }

      .artwork_ProfilePictures {
        width: 240px;
        height: 240px;
        object-fit: cover;
        box-shadow: 0 0 15px #070707;
        border-radius: 20px;
        padding: 5px;
        background: #a8a2a2;
      }
    </style>
  </head>

  <body>
    <h1 class="H1Titles">Scrufflx Portfolio!</h1>
    <p class="PTitles">Most Of My Art Work Will Be Listed Here!</p>

    <h3 class="H3Titles">Profile Pictures:</h3>

    <div>
      <img class="artwork_ProfilePictures" src="./images/ProfilePictures/ProfilePicture1.png" alt="My artwork">
      <img class="artwork_ProfilePictures" src="./images/ProfilePictures/ProfilePicture2.png" alt="My artwork">
      <img class="artwork_ProfilePictures" src="./images/ProfilePictures/ProfilePicture3.png" alt="My artwork">
      <img class="artwork_ProfilePictures" src="./images/ProfilePictures/ProfilePicture4.png" alt="My artwork">
    </div>
  </body>
</html>
