<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrufflx Portfolio</title>
    <style>
      body {
        padding-left: 10px;
        min-height: 100vh;
        margin: 0;
        background-image: linear-gradient(180deg, #a72222, #111010);
        background-repeat: no-repeat;
        background-size: cover;
        background-attachment: fixed;
        font-family: "Fredoka", sans-serif;
      }

      .H1Titles {
        color: white;
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
        text-shadow: 2px 2px 0px #000000;
        text-decoration: underline;
        text-decoration-color: #fcfcfc;
        text-underline-offset: 8px;
      }

      .H3Titles {
        color: white;
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
        text-shadow: 1px 1px 0px black;
      }

      .PTitles {
        color: white;
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
        text-shadow: 1px 1px 0px black;
      }

      .artwork_ProfilePictures {
        width: 240px;
        height: 240px;
        object-fit: cover;
        box-shadow: 0px 0px 15px rgb(7, 7, 7);
        border-radius: 20px;
        padding: 5px;
        background-color: rgb(168, 162, 162);
      }
    </style>
  </head>

  <body>
    <h1 class="H1Titles">Scrufflx Portfolio!</h1>
    <p class="PTitles">Most Of My Art Work Will Be Listed Here!</p>

    <h3 class="H3Titles">Profile Pictures:</h3>

    <div>
      <img class="artwork_ProfilePictures" src="./images/ProfilePicture1.png" alt="My artwork">
      <img class="artwork_ProfilePictures" src="./images/ProfilePicture2.png" alt="My artwork">
      <img class="artwork_ProfilePictures" src="./images/ProfilePicture3.png" alt="My artwork">
      <img class="artwork_ProfilePictures" src="./images/ProfilePicture4.png" alt="My artwork">
    </div>

  </body>
</html>
